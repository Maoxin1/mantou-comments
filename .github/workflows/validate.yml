name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Set isolated dependency cache
        run: echo "MANTOU_NPM_CACHE=$RUNNER_TEMP/mantou-npm-cache" >> "$GITHUB_ENV"
      - name: Install locked application without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund --cache "$MANTOU_NPM_CACHE"
      - name: Check runtime syntax
        run: npm run check
      - name: Test application and prime isolated reference dependencies
        env:
          MANTOU_REFERENCE_ALLOW_NETWORK: '1'
        run: npm test
      - name: Replay all tests with offline reference dependencies
        run: npm test
      - name: Verify installed dependency tree
        run: npm ls --all
